services:
  - type: web
    name: my-chatbot-mcp
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: DATA_DIR
        value: /tmp/plant-drawings

      - key: UPLOAD_API_KEY
        generateValue: true

      - key: MCP_ACCESS_TOKEN
        generateValue: true